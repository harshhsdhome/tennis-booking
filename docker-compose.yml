services:
  db:
    image: postgres:16-alpine
    container_name: tennis_booking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tennis_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tennis_booking_app
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tennis_booking
      JWT_SECRET: change_me_to_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
